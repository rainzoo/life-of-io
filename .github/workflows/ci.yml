name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx eslint src/ --max-warnings 0
      - run: npx knip
